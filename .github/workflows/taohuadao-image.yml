name: 桃花岛 build openim-server image -> GHCR

# 把打了补丁的 open-im-server 编成镜像推到 GHCR(公开),供线上 compose 直接拉取。
# 用默认 GITHUB_TOKEN 推到自己账号的 ghcr,无需额外 secret。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag"
        required: true
        default: "v3.8.3-fix"
  push:
    branches:
      - patch-v3.8.3

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/yaooort/open-im-server:${{ github.event.inputs.tag || 'v3.8.3-fix' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
