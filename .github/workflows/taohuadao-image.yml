name: 桃花岛 build openim-server image -> GHCR/Aliyun

# 把打了补丁的 open-im-server 编成镜像,同时推到 GHCR 和阿里云 ACR。
# GHCR 供公开兜底;阿里云镜像供国内线上 compose 默认拉取。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag"
        required: true
        default: "v3.8.3-fix"
  push:
    branches:
      - patch-v3.8.3

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.inputs.tag || 'v3.8.3-fix' }}
      HAS_ALIYUN_ACR: ${{ secrets.ALIREGISTRY_USERNAME != '' && secrets.ALIREGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: env.HAS_ALIYUN_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIREGISTRY_USERNAME }}
          password: ${{ secrets.ALIREGISTRY_TOKEN }}

      - name: Notice Aliyun ACR skipped
        if: env.HAS_ALIYUN_ACR != 'true'
        run: echo "::warning::ALIREGISTRY_USERNAME/ALIREGISTRY_TOKEN 未配置,本次只推 GHCR;配置后会同步推到阿里云 ACR。"

      - name: Build and push to GHCR (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/yaooort/open-im-server:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Aliyun ACR (linux/amd64)
        if: env.HAS_ALIYUN_ACR == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: registry.cn-hangzhou.aliyuncs.com/suyfm/open-im-server:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
